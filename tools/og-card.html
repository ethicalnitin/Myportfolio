<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for public/og.png (1200x630 link preview). Run `npm run render`. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f7f6f2; color: #17181c; font-family: "IBM Plex Sans", Arial, sans-serif;
         display: grid; grid-template-columns: 1fr 360px; padding: 72px 80px; gap: 40px; }

  .kicker { font-size: 20px; color: #b4410e; font-weight: 500; }
  h1 { font-size: 76px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin-top: 20px; }
  p.line { font-size: 27px; color: #464950; margin-top: 28px; line-height: 1.4; max-width: 640px; }
  .url { position: absolute; left: 80px; bottom: 64px; font-size: 20px; color: #686b73; }
  .rule { position: absolute; left: 80px; right: 80px; bottom: 112px; height: 1px; background: #dad7ce; }
  svg { align-self: center; }
</style>
</head>
<body>
  <div>
    <p class="kicker mono">Backend engineer · Node.js · Java / Spring Boot</p>
    <h1>Nitin Srivastava</h1>
